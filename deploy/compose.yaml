name: bcl-p0
services:
  mysql:
    image: mysql:8.0
    command: ["--server-id=101", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--innodb-buffer-pool-size=256M"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_root_password, mysql_app_password]
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./mysql/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro"]
    cpuset: "0"
    mem_limit: 1g
    ulimits: {nofile: {soft: 65536, hard: 65536}}
    healthcheck: {test: ["CMD-SHELL", 'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql -uroot -h127.0.0.1 --execute="SELECT 1 FROM bcl.bench_run LIMIT 0" >/dev/null 2>&1'], interval: 5s, timeout: 3s, retries: 30}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:16379:6379"]
    cpuset: "1"
    mem_limit: 192m
    ulimits: {nofile: {soft: 65536, hard: 65536}}
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  e1:
    build: {context: .., dockerfile: deploy/e1.Dockerfile, args: {SOURCE_COMMIT: "${BCL_SOURCE_COMMIT:-unverified}"}}
    environment: {GUIDE_ADDRESS: "0.0.0.0:8086", ADMIN_ADDRESS: "0.0.0.0:9086", REDIS_ADDR: "redis:6379"}
    ports: ["127.0.0.1:18086:8086", "127.0.0.1:19086:9086"]
    depends_on: {redis: {condition: service_healthy}}
    cpuset: "2"
    mem_limit: 192m
    ulimits: {nofile: {soft: 65536, hard: 65536}}
  e2:
    build: {context: .., dockerfile: deploy/e2.Dockerfile, args: {SOURCE_COMMIT: "${BCL_SOURCE_COMMIT:-unverified}"}}
    environment: {ROOM_ADDRESS: "0.0.0.0:8082", ADMIN_ADDRESS: "0.0.0.0:9082"}
    ports: ["127.0.0.1:18082:8082", "127.0.0.1:19082:9082"]
    cpuset: "2"
    mem_limit: 256m
    ulimits: {nofile: {soft: 65536, hard: 65536}}
  e3:
    build: {context: .., dockerfile: deploy/e3.Dockerfile, args: {SOURCE_COMMIT: "${BCL_SOURCE_COMMIT:-unverified}"}}
    environment: {RULE_ADDRESS: "0.0.0.0:8083", ADMIN_ADDRESS: "0.0.0.0:9083", RULE_EVAL_BINARY: /rule-eval}
    ports: ["127.0.0.1:18083:8083", "127.0.0.1:19083:9083"]
    cpuset: "3"
    mem_limit: 256m
    ulimits: {nofile: {soft: 65536, hard: 65536}}
  e5:
    build: {context: .., dockerfile: deploy/e5.Dockerfile, args: {SOURCE_COMMIT: "${BCL_SOURCE_COMMIT:-unverified}"}}
    command: ["-state", "/data/cmdb.json"]
    environment: {CMDB_ADDRESS: "0.0.0.0:8085", ADMIN_ADDRESS: "0.0.0.0:9085"}
    ports: ["127.0.0.1:18085:8085", "127.0.0.1:19085:9085"]
    volumes: ["cmdb_data:/data"]
    cpuset: "3"
    mem_limit: 256m
    ulimits: {nofile: {soft: 65536, hard: 65536}}
secrets:
  mysql_root_password: {file: ../.local/deploy/mysql_root_password}
  mysql_app_password: {file: ../.local/deploy/mysql_app_password}
volumes:
  mysql_data:
  cmdb_data:
